name: Build, test, and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msvc
            os: windows-2022
            cmake_args: -A x64
            package: true
          - name: linux-x64-gcc
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=g++
            package: true
          - name: linux-x64-clang
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
            package: false
          - name: macos-arm64-clang
            os: macos-15
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
            package: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ clang cmake git dpkg-dev
      - name: Check macOS architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DKUKRI_REQUIRE_TEST_DEPENDENCIES=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300
      - name: Build archive
        if: matrix.package
        working-directory: build
        run: cpack -C Release
      - name: Test extracted archive
        if: matrix.package
        run: python tests/package_smoke.py build/packages
      - name: Build Debian package
        if: matrix.name == 'linux-x64-gcc'
        working-directory: build
        run: cpack -C Release -G DEB
      - name: Install and test Debian package
        if: matrix.name == 'linux-x64-gcc'
        run: |
          sudo apt-get install -y ./build/packages/*.deb
          python tests/integration.py /usr/bin/kukri "$(command -v git)"
          sudo apt-get remove -y kukri
          test ! -e /usr/bin/kukri
      - name: Generate checksums
        if: matrix.package
        run: python tests/package_smoke.py build/packages --checksums-only
      - name: Upload tested packages
        if: matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: kukri-${{ matrix.name }}
          path: |
            build/packages/*.zip
            build/packages/*.tar.gz
            build/packages/*.deb
            build/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.name }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore
